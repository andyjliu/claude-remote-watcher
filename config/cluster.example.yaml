# Per-cluster config for claude-remote-watcher. Lives at
# ~/.config/claude-watcher/cluster.yaml (never inside a watched directory).
# Anything here can be overridden per directory in <dir>/.watcher/watcher.yaml
# (same keys, deep-merged).

slurm:
  cluster: null              # name of this cluster, e.g. "babel"; prefixes every Slack message as "[babel]", names the
                             # remote-control session cw:<dir>@babel, and lets you address DMs ("babel: status", "@babel ...").
                             # Default: $SLURM_CLUSTER_NAME, else the hostname prefix.
  partition: fnsw            # CHANGE: a cheap partition that tolerates long-lived CPU jobs
  qos: fnsw_qos              # CHANGE (or null)
  gres: "gpu:0"              # CHANGE: null to omit; some clusters reject 0-GPU jobs -> "gpu:1"
  cpus: 2
  mem: 4G
  time: "1-00:00:00"         # the watcher chains a fresh allocation before this expires
  chain_margin_min: 60       # exit this many minutes before `time` (successor is already queued)
  extra_sbatch: []           # e.g. ["--exclude=node1,node2", "--account=foo"]
  job_name_prefix: "cw"      # watcher jobs are named "<prefix>:<dirname>"

claude:
  bin: claude
  # Model + per-turn budget for each kind of Claude turn. Any model alias or
  # full model id the `claude` CLI accepts.
  tiers:
    classify: {model: sonnet,         budget_usd: 1}   # cheap triage of crashes the regexes don't recognize (see classify_unknown)
    tier2:    {model: claude-opus-4-8, budget_usd: 6}   # code changes: trivial-crash diagnose+patch+resubmit
    tier3:    {model: fable,           budget_usd: 8}  # everything else: diagnose, propose, escalate
    chat:     {model: claude-opus-4-8, budget_usd: 4}  # replies to your Slack messages / standing orders
    compact:  {model: sonnet,         budget_usd: 1}   # agent_notes.md compaction
    report:   {model: sonnet,         budget_usd: 1}   # prose paragraph at the top of the daily digest (watcher.report_llm_summary)
  # When a FAILED job matches neither the oom nor the trivial regexes, ask the `classify`
  # model which it is before spending a tier-3 turn: TRIVIAL->tier2, OOM->tier1,
  # TRANSIENT->tier0 resubmit, REAL/UNSURE->tier3.
  classify_unknown: true
  turn_timeout_min: 40
  quota_backoff_min: 30
  remote_control:
    enabled: true
    permission_mode: acceptEdits
    recycle_idle_hours: 12      # restart the remote-control server after this much idle

slack:
  bot_token_file: ~/.config/claude-watcher/slack_bot_token   # xoxb-...  (chat:write, im:write, im:history)
  user_id_file:   ~/.config/claude-watcher/slack_user_id     # U...      sole recipient
  thread_per_job: true
  poll_sec: 60               # inbound is polled (conversations.history); Socket Mode is not used because Slack
                             # delivers each event to only ONE of an app's connections, so clusters sharing the
                             # bot would each hear a random subset of your DMs. Slack polls cost no Claude quota.
  thread_watch_hours: 24     # poll replies in our threads with activity this recent (hot <2h: every cycle; rest: 3/cycle)
  peer_clusters: []          # other clusters sharing this bot, e.g. [orchard]; DMs addressed to them are ignored here.
                             # Also learned automatically from their "[name] ..." posts, so this is only a warm start.

watcher:
  poll_interval_sec: 300
  idle_poll_interval_sec: 1800     # when no live jobs
  lookback_days: 2                 # adopt jobs submitted this long before `watch start`
  report_hour: 9                   # daily digest, local time
  timezone: America/New_York
  report_llm_summary: true         # 2-4 sentence paragraph at the top of the digest (claude.tiers.report, sonnet, ~1 turn/day)
  notes_max_kb: 24                 # compact agent_notes.md beyond this
  stall_min: 60                    # RUNNING with no stdout growth for this long -> STALLED
  max_attempts: 3                  # tier-0/1 resubmits per job lineage
  max_llm_turns_per_hour: 12       # rolling cap on Claude turns (3 per poll on top); user replies are exempt
  # Identical failures (same job name + fingerprint of the last error line) are one problem: after the
  # first ESCALATE, repeats post a threaded "+1" at most every escalation_delta_min instead of a new turn,
  # until you reply in the thread. Past quarantine_after failures on >= quarantine_min_nodes nodes the job
  # name is quarantined: no resubmits, no turns, until `unquarantine <name>` (0 disables).
  escalation_delta_min: 30
  quarantine_after: 3
  quarantine_min_nodes: 2
  controller_name_glob: "*_ctl"    # array tasks submitted while such a job ran in the same dir are re-driven by it:
                                   # default resume=none, preemptions left alone (null disables)
  mem_bump: 1.5                    # OOM: multiply --mem by this
  max_mem_gb: 480
  log_tail_lines: 150
  # Regexes (search on the last log_tail_lines) that mark a crash as "trivial" -> tier 2.
  trivial_patterns:
    - "ModuleNotFoundError"
    - "ImportError"
    - "FileNotFoundError"
    - "No such file or directory"
    - "NameError"
    - "SyntaxError"
    - "IndentationError"
    - "AttributeError: module .* has no attribute"
    - "TypeError: .* got an unexpected keyword argument"
    - "KeyError: '[A-Za-z_]+'"
    - "unrecognized arguments"
  oom_patterns:
    - "CUDA out of memory"
    - "OutOfMemoryError"
    - "oom-kill"
    - "Out of memory"
    - "MemoryError"
